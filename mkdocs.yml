site_name: Claw Gets Shit Done (CGSD)
site_description: OpenClaw GSD Suite documentation
site_url: https://ironyh.github.io/claw-gets-shit-done/
repo_url: https://github.com/ironyh/claw-gets-shit-done
repo_name: ironyh/claw-gets-shit-done

theme:
  name: material
  language: en
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.instant
    - navigation.tracking
    - search.highlight
    - search.suggest
    - content.code.copy

nav:
  - Overview: index.md
  - Quickstart:
      - Happy Paths: happy-paths.md
      - Install & Update: install-update.md
      - Discord Setup: discord-setup.md
  - Configuration:
      - Configuration: configuration.md
      - Loop Settings: loop-settings.md
      - GSD Settings: gsd-settings.md
      - Persona & Flow Settings: persona-flows.md
  - Flows:
      - Command Reference: command-reference.md
      - Discord Forum Flow: discord-forum-flow.md
      - Architecture: architecture.md
  - Operations:
      - Runbook: operations.md
      - Troubleshooting: troubleshooting.md
      - Build & Release: build-release.md
      - FAQ: faq.md
  - Product:
      - Wizard Roadmap: wizards-roadmap.md
      - Proposals: proposals.md

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - fenced_code
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css
